# Redpanda (Kafka API) + Console + producer giá coin (giai đoạn 1) + producer tin tức (giai đoạn 2)
# + NLP worker gán nhãn tin bằng Ollama (giai đoạn 3) + ClickHouse và Grafana (giai đoạn 4)
# + cảnh báo Telegram (giai đoạn 5).
# Mọi cổng chỉ mở trên 127.0.0.1 của Oracle; xem từ Kali qua SSH tunnel (README).
name: news-market

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container # 1 node, bỏ kiểm tra phần cứng, phù hợp máy đơn
      - --smp=1
      - --memory=1536M
      - --reserve-memory=0M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:19092:19092" # Kafka cho công cụ chạy trên host / qua tunnel
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pipeline]

  # Tạo topic một lần rồi thoát (chạy lại không sao, topic đã có thì bỏ qua).
  topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk -X brokers=redpanda:9092 topic create prices.tick -p 3 -r 1 \
          -c retention.ms=604800000 -c retention.bytes=2147483648 -c compression.type=producer \
          || true
        rpk -X brokers=redpanda:9092 topic create news.raw -p 3 -r 1 \
          -c retention.ms=2592000000 -c compression.type=producer \
          || true
        rpk -X brokers=redpanda:9092 topic create news.enriched -p 3 -r 1 \
          -c retention.ms=7776000000 -c compression.type=producer \
          || true
        rpk -X brokers=redpanda:9092 topic create social.mentions -p 3 -r 1 \
          -c retention.ms=2592000000 -c compression.type=producer \
          || true
        rpk -X brokers=redpanda:9092 topic list
    restart: "no"
    networks: [pipeline]

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "127.0.0.1:8090:8080" # 8080 đã bị backoffice dùng
    networks: [pipeline]

  price-producer:
    build:
      context: .
      args:
        APP: price-producer
    container_name: price-producer
    restart: unless-stopped
    depends_on:
      topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: redpanda:9092
      PRICE_TOPIC: prices.tick
      PRODUCTS: BTC-USD,ETH-USD,PAXG-USD # PAXG: token 1 ounce vàng, đại diện giá vàng (giao dịch 24/7)
    networks: [pipeline]

  news-producer:
    build:
      context: .
      args:
        APP: news-producer
    container_name: news-producer
    restart: unless-stopped
    depends_on:
      topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: redpanda:9092
      NEWS_TOPIC: news.raw
      GDELT_EVERY: 15m
      RSS_EVERY: 10m
    networks: [pipeline]

  # Đếm số bài Bluesky theo chủ đề mỗi phút (Jetstream công khai, không cần key). Không lưu nội dung bài.
  social-producer:
    build:
      context: .
      args:
        APP: social-producer
    container_name: social-producer
    restart: unless-stopped
    depends_on:
      topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: redpanda:9092
      SOCIAL_TOPIC: social.mentions
    networks: [pipeline]

  # Dùng mạng của host để gọi Ollama ở 127.0.0.1:11434 (Ollama không mở ra ngoài) và Kafka ở localhost:19092.
  # Container này không mở cổng nào.
  nlp-worker:
    build:
      context: .
      args:
        APP: nlp-worker
    container_name: nlp-worker
    restart: unless-stopped
    network_mode: host
    depends_on:
      topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: localhost:19092
      IN_TOPIC: news.raw
      OUT_TOPIC: news.enriched
      GROUP: nlp-worker
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen2.5:7b
      REDIS_ADDR: 127.0.0.1:6379 # Redis dùng chung (~/infra/redis), key có prefix nlp:done:
    # Lấy REDIS_PASSWORD từ file của Redis dùng chung trên Oracle, không chép mật khẩu vào repo.
    env_file:
      - path: ../infra/redis/.env
        required: false

  # Giai đoạn 4: ClickHouse tự đọc 3 topic bằng Kafka engine (không cần service Go riêng).
  # Mật khẩu nằm trong .env trên Oracle (xem README), không có trong repo.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39
    container_name: clickhouse
    restart: unless-stopped
    mem_limit: 3g
    depends_on:
      topics:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_USER: pipeline
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?thiếu CLICKHOUSE_PASSWORD trong .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
      CH_GRAFANA_PASSWORD: ${CH_GRAFANA_PASSWORD:?thiếu CH_GRAFANA_PASSWORD trong .env}
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/pipeline.xml:/etc/clickhouse-server/config.d/pipeline.xml:ro
      - ./clickhouse/users.d/grafana.xml:/etc/clickhouse-server/users.d/grafana.xml:ro
    ports:
      - "127.0.0.1:8123:8123" # HTTP; cổng native 9000 đã bị auth-service dùng nên không mở
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [pipeline]

  # Áp schema rồi thoát; chạy lại không sao (IF NOT EXISTS / OR REPLACE).
  clickhouse-schema:
    image: clickhouse/clickhouse-server:24.8.14.39
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?thiếu CLICKHOUSE_PASSWORD trong .env}
    volumes:
      - ./clickhouse/schema:/schema:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for f in /schema/*.sql; do
          echo "apply $$f"
          clickhouse-client --host clickhouse --user pipeline --password "$$CLICKHOUSE_PASSWORD" --multiquery --queries-file "$$f"
        done
    restart: "no"
    networks: [pipeline]

  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: grafana
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      clickhouse-schema:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?thiếu GF_ADMIN_PASSWORD trong .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.5
      CH_GRAFANA_PASSWORD: ${CH_GRAFANA_PASSWORD:?thiếu CH_GRAFANA_PASSWORD trong .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [pipeline]

  # Giai đoạn 5: cảnh báo Telegram. Mạng host để tới Kafka (localhost:19092), ClickHouse (127.0.0.1:8123)
  # và Redis dùng chung (127.0.0.1:6379). Token bot nằm trong .env.alerter trên Oracle, không có trong repo.
  alerter:
    build:
      context: .
      args:
        APP: alerter
    container_name: alerter
    restart: unless-stopped
    network_mode: host
    depends_on:
      clickhouse-schema:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: localhost:19092
      IN_TOPIC: news.enriched
      GROUP: alerter
      CLICKHOUSE_URL: http://127.0.0.1:8123
      CLICKHOUSE_USER: grafana
      CH_GRAFANA_PASSWORD: ${CH_GRAFANA_PASSWORD:?thiếu CH_GRAFANA_PASSWORD trong .env}
      REDIS_ADDR: 127.0.0.1:6379 # key alert:news:<id>, giữ 7 ngày
      ALERT_MIN_IMPACT: "3"
      ALERT_MAX_PER_HOUR: "10"
      PRICE_WINDOW: 15m
      PRICE_MOVE_PCT: "1.5"
      PRICE_COOLDOWN: 1h
      ALERT_UTC_OFFSET: "7"
      DIGEST_AT: "21:00" # tóm tắt 24 giờ, giờ Việt Nam; "off" để tắt
    env_file:
      - path: ../infra/redis/.env # REDIS_PASSWORD
        required: false
      - path: .env.alerter # TG_TOKEN (bot riêng cho cảnh báo), TG_CHAT_ID; chỉ có trên Oracle, quyền 600
        required: true

volumes:
  redpanda-data:
  clickhouse-data:
  grafana-data:

networks:
  pipeline:
    name: pipeline
