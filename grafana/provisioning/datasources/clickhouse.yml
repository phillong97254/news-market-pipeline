# Mật khẩu lấy từ biến môi trường của container (file .env trên Oracle).
apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      secure: false
      username: grafana
      defaultDatabase: market
      queryTimeout: "60" # giây; ClickHouse chặn trần 300 cho user grafana
    secureJsonData:
      password: $CH_GRAFANA_PASSWORD
